[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-gaming-montage-editor"
version = "0.1.0"
description = "Local, game-independent montage analysis and rendering"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]
ai = ["anthropic>=1.11,<2"]

[project.scripts]
montage-editor = "montage_editor.cli:main"
montage-studio = "montage_editor.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
montage_editor = ["resources/*.jpg"]
