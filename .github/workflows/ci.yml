name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install '.[ai,links]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libpulse0
      - run: python -m pip install '.[desktop]'
      - run: python -m unittest discover -s tests -p desktop_checks.py -v
