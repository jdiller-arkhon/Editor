name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install '.[ai,links]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libopengl0 libpulse0
      - run: python -m pip install '.[desktop]'
      - run: python -m unittest discover -s tests -p desktop_checks.py -v
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: choco install ffmpeg -y --no-progress
      - run: python -m pip install ".[ai,links,desktop]"
      - name: Core tests on Windows
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          python -m unittest discover -s tests -v
      - name: Desktop checks on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p desktop_checks.py -v
